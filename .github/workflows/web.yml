# Publica Marea para el navegador en GitHub Pages: https://juan0703music.github.io/pesquera/
# Solo se publica la página: los datos de cada pesquera se quedan en el navegador de su computador.
name: Marea en el navegador

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "src/**"
      - "prisma/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/web.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construir:
    name: Construir y probar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Dependencias (genera los clientes de Prisma)
        run: npm ci --no-audit --no-fund
      - name: Tipos
        run: npm run web:tipos
      - name: Pruebas de la versión del navegador
        run: npm run web:pruebas
      - name: Construir
        run: node web/construir.mjs --base /pesquera/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  publicar:
    name: Publicar
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicacion.outputs.page_url }}
    steps:
      - id: publicacion
        uses: actions/deploy-pages@v5
